# =============================================================================
# ContainerizedCPP Microservices — Docker Compose
#
# Three services sharing a DDS domain on a Docker bridge network.
# Each container runs one process — the core microservice pattern.
#
# ┌─────────────────────────────────────────────────────────────┐
# │  Docker bridge network (dds-net)                            │
# │                                                              │
# │  ┌──────────────────┐    DDS     ┌──────────────────────┐   │
# │  │ radar-radar       │──────────▶│  radar-workstation    │   │
# │  │ RadarTrack        │           │  (sends Command,      │   │
# │  │ ComponentStatus   │           │   logs QoS effects)   │   │
# │  │ RadarAlert        │           └──────────────────────┘   │
# │  └──────────────────┘    DDS     ┌──────────────────────┐   │
# │           └───────────────────▶│  omniscope-dds         │   │
# │                                 │  :8080 (HTTP/WS)      │──┼──▶ Browser
# │                                 └──────────────────────┘   │
# └─────────────────────────────────────────────────────────────┘
#
# Usage:
#   1. Build the dev base image (one-time, from repo root):
#        docker build -t containerizedcpp-dev .
#
#   2. Build and start the services:
#        docker compose -f deploy/docker-compose.yml up --build
#
#   3. Open OmniscopeDds in your browser:
#        http://localhost:8080
#
#   4. Stop everything:
#        docker compose -f deploy/docker-compose.yml down
# =============================================================================

# ---------------------------------------------------------------------------
# YAML anchor: shared configuration for all services
# ---------------------------------------------------------------------------
# "x-" prefixed keys are called "extension fields" — Compose ignores them as
# services but they can be referenced via YAML anchors (&common / *common).
# This avoids repeating the same build/image/network config in every service.
# ---------------------------------------------------------------------------
x-common: &common
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  image: containerizedcpp-deploy
  networks:
    - dds-net
  environment:
    # Tell Cyclone DDS to use our custom config (enables unicast peer discovery)
    - CYCLONEDDS_URI=file:///etc/cyclonedds/cyclonedds.xml
  volumes:
    # Mount the DDS config as a read-only file inside the container
    - ./cyclonedds.xml:/etc/cyclonedds/cyclonedds.xml:ro
  restart: on-failure

# ---------------------------------------------------------------------------
# The services — each container runs exactly ONE process (microservice pattern)
# ---------------------------------------------------------------------------
services:
  # Service 1: Radar sensor node — publishes RadarTrack (Best Effort),
  # ComponentStatus and RadarAlert (both TransientLocal), replies to Command
  radar-radar:
    <<: *common
    container_name: radar-radar
    command: ["RadarDDSRadar", "0"]

  # Service 2: Operator workstation — sends Command, subscribes to the
  # radar's topics and logs the practical effect of each QoS profile
  radar-workstation:
    <<: *common
    container_name: radar-workstation
    command: ["RadarDDSWorkstation", "0"]
    # Wait for the radar to start (ordering hint, not a readiness guarantee)
    depends_on:
      - radar-radar

  # Service 3: Web-based DDS traffic inspector with dynamic topic discovery,
  # recording, and playback — discovers and displays whatever topics are
  # live on the domain; the only externally-exposed service
  omniscope-dds:
    <<: *common
    container_name: omniscope-dds
    command: ["OmniscopeDds", "0", "8080"]
    ports:
      # HOST:CONTAINER — maps host port 8080 to the container's port 8080
      # This is what lets your browser reach OmniscopeDds from outside Docker
      - "8080:8080"
    depends_on:
      - radar-radar

# ---------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------
# A user-defined bridge network. All containers on this network can reach
# each other by container name (Docker's built-in DNS). This is how the
# cyclonedds.xml peer list ("radar-radar", "radar-workstation", "omniscope-dds")
# resolves to actual IP addresses.
# ---------------------------------------------------------------------------
networks:
  dds-net:
    driver: bridge
