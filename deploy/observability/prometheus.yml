# =============================================================================
# Prometheus scrape config for the RadarDDSDemo observability stack.
#
# Scrapes the OTel Collector's Prometheus exporter (see
# otel-collector-config.yaml), which republishes whatever metrics
# RadarDDSWorkstation/RadarDDSRadar sent it over OTLP.
# =============================================================================

global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]
