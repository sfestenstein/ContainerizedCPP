# =============================================================================
# RadarDDSDemo Observability Stack — Docker Compose
#
# RadarDDSRadar + RadarDDSWorkstation -> OTel Collector -> Prometheus ->
# Grafana. Everything needed to watch the dds.messages.sent /
# dds.messages.received metrics comes up with a single `docker compose up`,
# including the demo apps themselves — this avoids relying on the host's
# networking to reach a separately-run OTel Collector (e.g. a devcontainer's
# "localhost" does not reach a collector container started outside it).
#
# The radar-radar/radar-workstation services below mirror
# deploy/docker-compose.yml's, with one addition: OTEL_EXPORTER_OTLP_ENDPOINT
# points them at the otel-collector service by container name instead of the
# default localhost:4317.
#
# Usage:
#   1. Build the dev base image (one-time, from repo root):
#        docker build -t containerizedcpp-dev .
#
#   2. Start everything (apps + observability stack):
#        docker compose -f deploy/observability/docker-compose.yml up --build
#
#   3. Open the dashboard:
#        http://localhost:3000
#
#   4. Stop everything:
#        docker compose -f deploy/observability/docker-compose.yml down
# =============================================================================

x-radar-common: &radar-common
  build:
    context: ../..
    dockerfile: deploy/Dockerfile
  image: containerizedcpp-deploy
  environment:
    # Tell Cyclone DDS to use the containerized peer-discovery config.
    - CYCLONEDDS_URI=file:///etc/cyclonedds/cyclonedds.xml
    # Redirect OTLP export from the default localhost:4317 to the
    # otel-collector service on this compose network.
    - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
  volumes:
    - ../cyclonedds.xml:/etc/cyclonedds/cyclonedds.xml:ro
  networks:
    - observability-net
  restart: on-failure
  depends_on:
    - otel-collector

services:
  otel-collector:
    image: otel/opentelemetry-collector:0.110.0
    container_name: otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      # Published to the host: RadarDDSWorkstation/RadarDDSRadar's default
      # OTLP endpoint (localhost:4317) reaches this container directly.
      - "4317:4317"
    networks:
      - observability-net

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      # Optional — lets you poke around in Prometheus's own UI directly.
      - "9090:9090"
    networks:
      - observability-net
    depends_on:
      - otel-collector

  loki:
    image: grafana/loki:latest
    container_name: loki
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      # Optional — lets you poke around with logcli or curl the OTLP
      # ingestion endpoint directly.
      - "3100:3100"
    networks:
      - observability-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      # Skip the login screen so the demo goes straight to the dashboard.
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    networks:
      - observability-net
    depends_on:
      - prometheus
      - loki

  radar-radar:
    <<: *radar-common
    container_name: radar-radar
    command: ["RadarDDSRadar", "0"]

  radar-workstation:
    <<: *radar-common
    container_name: radar-workstation
    command: ["RadarDDSWorkstation", "0"]
    depends_on:
      - otel-collector
      - radar-radar

networks:
  observability-net:
    driver: bridge
