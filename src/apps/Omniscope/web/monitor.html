<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Omniscope</title>
<style>
:root {
   --bg: #1e1e2e;
   --surface: #2a2a3c;
   --border: #3a3a4c;
   --text: #cdd6f4;
   --muted: #888;
   --accent: #89b4fa;
   --green: #a6e3a1;
   --red: #f38ba8;
   --yellow: #f9e2af;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
   font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
   font-size: 13px;
   background: var(--bg);
   color: var(--text);
   height: 100vh;
   display: flex;
   flex-direction: column;
}
header {
   display: flex;
   align-items: center;
   justify-content: space-between;
   padding: 8px 16px;
   background: var(--surface);
   border-bottom: 1px solid var(--border);
}
header h1 { font-size: 15px; font-weight: 600; }
.toolbar { display: flex; gap: 8px; align-items: center; }
.toolbar button {
   background: var(--border);
   color: var(--text);
   border: none;
   border-radius: 4px;
   padding: 4px 12px;
   cursor: pointer;
   font-family: inherit;
   font-size: 12px;
}
.toolbar button:hover { background: var(--accent); color: var(--bg); }
.toolbar button.active { background: var(--red); color: var(--bg); }
.status-dot {
   width: 8px; height: 8px; border-radius: 50%;
   background: var(--red);
   display: inline-block;
}
.status-dot.connected { background: var(--green); }
#statusText { margin-left: 4px; font-size: 11px; color: var(--muted); }

.panels {
   flex: 1;
   display: flex;
   overflow: hidden;
}
.panel {
   display: flex;
   flex-direction: column;
   border-right: 1px solid var(--border);
   overflow: hidden;
}
.panel:last-child { border-right: none; }
.panel-header {
   padding: 6px 12px;
   background: var(--surface);
   border-bottom: 1px solid var(--border);
   font-weight: 600;
   font-size: 12px;
   color: var(--muted);
   text-transform: uppercase;
   letter-spacing: 0.5px;
}
#topicsPanel { width: 220px; min-width: 180px; }
#messagesPanel { flex: 1; min-width: 260px; }
#detailPanel { flex: 1.2; min-width: 300px; }

.panel-body { flex: 1; overflow-y: auto; }

/* Transport groups */
.transport-group { margin-bottom: 2px; }
.transport-header {
   padding: 6px 12px;
   font-size: 11px;
   font-weight: 600;
   text-transform: uppercase;
   letter-spacing: 0.5px;
   background: var(--surface);
   border-bottom: 1px solid var(--border);
   display: flex;
   align-items: center;
   gap: 6px;
}
.transport-tag {
   font-size: 9px;
   padding: 1px 6px;
   border-radius: 8px;
   font-weight: 700;
   letter-spacing: 0.3px;
}
.transport-tag.dds  { background: #89b4fa; color: var(--bg); }
.transport-tag.zyre { background: #a6e3a1; color: var(--bg); }
.transport-tag.default { background: var(--border); color: var(--muted); }

/* Topics */
.topic-item {
   padding: 8px 12px 8px 20px;
   cursor: pointer;
   display: flex;
   justify-content: space-between;
   align-items: center;
   border-bottom: 1px solid var(--border);
   user-select: none;
}
.topic-item:hover { background: var(--surface); }
.topic-name { font-weight: 500; }
.topic-badge {
   font-size: 10px;
   padding: 1px 6px;
   border-radius: 8px;
   background: var(--border);
   color: var(--muted);
}
.topic-badge.subscribed {
   background: var(--green);
   color: var(--bg);
}

/* Messages */
.msg-item {
   padding: 6px 12px;
   cursor: pointer;
   border-bottom: 1px solid var(--border);
   display: flex;
   gap: 10px;
   align-items: baseline;
}
.msg-item:hover { background: var(--surface); }
.msg-item.selected { background: var(--border); }
.msg-topic {
   font-weight: 600;
   color: var(--accent);
   white-space: nowrap;
   min-width: 100px;
}
.msg-time { color: var(--muted); font-size: 11px; white-space: nowrap; }
.msg-preview { color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Detail */
#detailContent {
   padding: 12px;
   white-space: pre-wrap;
   word-break: break-all;
   font-size: 12px;
   line-height: 1.6;
}
.field-key { color: var(--accent); }
.field-val { color: var(--text); }

/* Context menu */
.ctx-menu {
   display: none;
   position: fixed;
   background: var(--surface);
   border: 1px solid var(--border);
   border-radius: 6px;
   padding: 4px 0;
   z-index: 100;
   min-width: 160px;
   box-shadow: 0 4px 16px rgba(0,0,0,0.4);
}
.ctx-menu.visible { display: block; }
.ctx-item {
   padding: 6px 16px;
   cursor: pointer;
   font-size: 12px;
}
.ctx-item:hover { background: var(--border); }

/* Recording indicator */
.rec-indicator { color: var(--red); font-weight: 600; display: none; }
.rec-indicator.active { display: inline; }

/* Playback progress bar */
.progress-bar {
   display: none;
   height: 3px;
   background: var(--border);
   width: 100%;
}
.progress-bar.active { display: block; }
.progress-fill {
   height: 100%;
   background: var(--accent);
   width: 0%;
   transition: width 0.15s linear;
}

/* Disabled button */
.toolbar button:disabled {
   opacity: 0.4;
   cursor: not-allowed;
}
.toolbar button:disabled:hover {
   background: var(--border);
   color: var(--text);
}
.toolbar button.playing {
   background: var(--yellow);
   color: var(--bg);
}

/* Footer */
footer {
   padding: 4px 16px;
   background: var(--surface);
   border-top: 1px solid var(--border);
   font-size: 11px;
   color: var(--muted);
   display: flex;
   justify-content: space-between;
}
</style>
</head>
<body>

<header>
   <h1>Omniscope</h1>
   <div class="toolbar">
      <span class="rec-indicator" id="recIndicator">&#x23FA; REC</span>
      <button id="btnRecord" onclick="toggleRecord()">Record</button>
      <button id="btnLoad" onclick="openLoadRecording()">Load Recording</button>
      <button id="btnPlayback" onclick="togglePlayback()" disabled>Playback</button>
      <button id="btnClear" onclick="clearMessages()">Clear</button>
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">Disconnected</span>
   </div>
</header>
<div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>

<div class="panels">
   <!-- Topics pane -->
   <div class="panel" id="topicsPanel">
      <div class="panel-header">Topics</div>
      <div class="panel-body" id="topicsList"></div>
   </div>

   <!-- Messages pane -->
   <div class="panel" id="messagesPanel">
      <div class="panel-header">Messages (<span id="msgCount">0</span>)</div>
      <div class="panel-body" id="messagesList"></div>
   </div>

   <!-- Detail pane -->
   <div class="panel" id="detailPanel">
      <div class="panel-header">Detail</div>
      <div class="panel-body">
         <div id="detailContent">Select a message to view its contents.</div>
      </div>
   </div>
</div>

<footer>
   <span id="footerInfo">Ready</span>
   <span id="footerStats"></span>
</footer>

<!-- Context menu -->
<div class="ctx-menu" id="ctxMenu">
   <div class="ctx-item" id="ctxToggleSub" onclick="ctxToggleSubscribe()"></div>
</div>

<!-- Load recording file input (hidden) -->
<input type="file" id="loadRecFile" accept=".dat" style="display:none"
       onchange="uploadRecording(event)">

<script>
const WS_URL = `ws://${location.host}/ws`;
let ws = null;
let topics = {};          // {name: {subscribed: bool, count: int}}
let messages = [];
let selectedMsgIdx = -1;
let recording = false;
let playing = false;
let recordingLoaded = false;
let recordingLineCount = 0;
let ctxTopicName = null;
const MAX_MESSAGES = 10000;

// --- WebSocket ---
function connect() {
   ws = new WebSocket(WS_URL);
   ws.onopen = () => {
      document.getElementById('statusDot').classList.add('connected');
      document.getElementById('statusText').textContent = 'Connected';
   };
   ws.onclose = () => {
      document.getElementById('statusDot').classList.remove('connected');
      document.getElementById('statusText').textContent = 'Disconnected';
      setTimeout(connect, 2000);
   };
   ws.onmessage = (evt) => {
      const msg = JSON.parse(evt.data);
      if (msg.type === 'topics') {
         handleTopicList(msg.topics);
      } else if (msg.type === 'message') {
         handleIncomingMessage(msg);
      } else if (msg.type === 'recording_started') {
         recording = true;
         updateRecUI();
      } else if (msg.type === 'recording_stopped') {
         recording = false;
         updateRecUI();
         if (msg.filename) {
            document.getElementById('footerInfo').textContent =
               `Recording saved: ${msg.filename}`;
         }
      } else if (msg.type === 'recording_loaded') {
         recordingLoaded = true;
         recordingLineCount = msg.count;
         updatePlaybackUI();
         document.getElementById('footerInfo').textContent =
            `Recording loaded: ${msg.count} messages`;
      } else if (msg.type === 'playback_started') {
         playing = true;
         updatePlaybackUI();
         document.getElementById('footerInfo').textContent =
            `Playback in progress: ${msg.count} messages...`;
      } else if (msg.type === 'playback_progress') {
         updateProgress(msg.current, msg.total);
      } else if (msg.type === 'playback_finished') {
         playing = false;
         updatePlaybackUI();
         resetProgress();
         document.getElementById('footerInfo').textContent = 'Playback finished';
      } else if (msg.type === 'playback_stopped') {
         playing = false;
         updatePlaybackUI();
         resetProgress();
         document.getElementById('footerInfo').textContent = 'Playback stopped';
      }
   };
}

function send(obj) {
   if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify(obj));
   }
}

// --- Topics ---
function handleTopicList(topicArr) {
   for (const t of topicArr) {
      if (!topics[t.name]) {
         topics[t.name] = { subscribed: t.subscribed, transport: t.transport, count: 0 };
      } else {
         topics[t.name].subscribed = t.subscribed;
         topics[t.name].transport = t.transport;
      }
   }
   renderTopics();
}

function renderTopics() {
   const el = document.getElementById('topicsList');
   el.innerHTML = '';

   // Group topics by transport
   const groups = {};
   for (const [name, info] of Object.entries(topics).sort()) {
      const tr = info.transport || 'Unknown';
      if (!groups[tr]) groups[tr] = [];
      groups[tr].push({ name, info });
   }

   for (const [transport, items] of Object.entries(groups).sort()) {
      const tagClass = transport.toLowerCase();
      const group = document.createElement('div');
      group.className = 'transport-group';

      // Section header with colored tag
      const hdr = document.createElement('div');
      hdr.className = 'transport-header';
      hdr.innerHTML = `<span class="transport-tag ${esc(tagClass)}">${esc(transport)}</span>`
                    + ` ${items.length} topic${items.length !== 1 ? 's' : ''}`;
      group.appendChild(hdr);

      // Topic rows
      for (const { name, info } of items) {
         const div = document.createElement('div');
         div.className = 'topic-item';
         div.innerHTML = `
            <span class="topic-name">${esc(name)}</span>
            <span class="topic-badge ${info.subscribed ? 'subscribed' : ''}">
               ${info.subscribed ? 'SUB' : 'OFF'}
            </span>`;
         div.oncontextmenu = (e) => { e.preventDefault(); showCtxMenu(e, name); };
         div.onclick = () => toggleSubscribe(name);
         group.appendChild(div);
      }

      el.appendChild(group);
   }
}

function toggleSubscribe(name) {
   const info = topics[name];
   if (!info) return;
   const action = info.subscribed ? 'unsubscribe' : 'subscribe';
   send({ type: action, topic: name });
}

// --- Context menu ---
function showCtxMenu(e, topicName) {
   ctxTopicName = topicName;
   const menu = document.getElementById('ctxMenu');
   const info = topics[topicName];
   document.getElementById('ctxToggleSub').textContent =
      info && info.subscribed ? `Unsubscribe from ${topicName}` : `Subscribe to ${topicName}`;
   menu.style.left = e.clientX + 'px';
   menu.style.top = e.clientY + 'px';
   menu.classList.add('visible');
}

function ctxToggleSubscribe() {
   if (ctxTopicName) toggleSubscribe(ctxTopicName);
   document.getElementById('ctxMenu').classList.remove('visible');
}

document.addEventListener('click', () => {
   document.getElementById('ctxMenu').classList.remove('visible');
});

// --- Messages ---
function handleIncomingMessage(msg) {
   const entry = {
      topic: msg.topic,
      time: msg.timestamp || new Date().toISOString(),
      data: msg.data,
      raw: msg
   };

   messages.push(entry);
   if (messages.length > MAX_MESSAGES) messages.shift();

   if (topics[msg.topic]) topics[msg.topic].count++;

   appendMessageRow(entry, messages.length - 1);
   document.getElementById('msgCount').textContent = messages.length;
   document.getElementById('footerStats').textContent =
      `${messages.length} messages`;
}

function appendMessageRow(entry, idx) {
   const el = document.getElementById('messagesList');
   const div = document.createElement('div');
   div.className = 'msg-item';
   div.dataset.idx = idx;

   const timeStr = new Date(entry.time).toLocaleTimeString('en-US', {
      hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit',
      fractionalSecondDigits: 3
   });

   const preview = summarize(entry.data);
   div.innerHTML = `
      <span class="msg-topic">${esc(entry.topic)}</span>
      <span class="msg-time">${timeStr}</span>
      <span class="msg-preview">${esc(preview)}</span>`;
   div.onclick = () => selectMessage(idx);
   el.appendChild(div);

   // Auto-scroll to bottom
   el.scrollTop = el.scrollHeight;
}

function selectMessage(idx) {
   selectedMsgIdx = idx;
   document.querySelectorAll('.msg-item').forEach(el => {
      el.classList.toggle('selected', parseInt(el.dataset.idx) === idx);
   });
   renderDetail(messages[idx]);
}

function renderDetail(entry) {
   const el = document.getElementById('detailContent');
   if (!entry) { el.textContent = 'Select a message.'; return; }
   el.innerHTML = `<span class="field-key">Topic:</span> ${esc(entry.topic)}\n` +
                  `<span class="field-key">Time:</span>  ${entry.time}\n\n` +
                  formatObject(entry.data, 0);
}

function formatObject(obj, indent) {
   if (obj === null || obj === undefined) return 'null';
   if (typeof obj !== 'object') return esc(String(obj));
   const pad = '  '.repeat(indent);
   let out = '';
   for (const [k, v] of Object.entries(obj)) {
      if (typeof v === 'object' && v !== null) {
         out += `${pad}<span class="field-key">${esc(k)}:</span>\n${formatObject(v, indent + 1)}`;
      } else {
         out += `${pad}<span class="field-key">${esc(k)}:</span> <span class="field-val">${esc(String(v))}</span>\n`;
      }
   }
   return out;
}

function summarize(data) {
   if (!data) return '';
   const parts = [];
   for (const [k, v] of Object.entries(data)) {
      if (typeof v !== 'object') parts.push(`${k}=${v}`);
      if (parts.length >= 3) break;
   }
   return parts.join(', ');
}

function clearMessages() {
   messages = [];
   selectedMsgIdx = -1;
   document.getElementById('messagesList').innerHTML = '';
   document.getElementById('detailContent').textContent = 'Select a message.';
   document.getElementById('msgCount').textContent = '0';
   document.getElementById('footerStats').textContent = '';
   for (const t of Object.values(topics)) t.count = 0;
}

// --- Recording ---
function toggleRecord() {
   if (!recording) {
      send({ type: 'record_start' });
   } else {
      send({ type: 'record_stop' });
   }
}

function updateRecUI() {
   const btn = document.getElementById('btnRecord');
   const ind = document.getElementById('recIndicator');
   btn.textContent = recording ? 'Stop' : 'Record';
   btn.classList.toggle('active', recording);
   ind.classList.toggle('active', recording);
}

function openLoadRecording() {
   document.getElementById('loadRecFile').click();
}

function uploadRecording(event) {
   const file = event.target.files[0];
   if (!file) return;
   const reader = new FileReader();
   reader.onload = (e) => {
      const text = e.target.result;
      document.getElementById('footerInfo').textContent =
         `Uploading recording...`;
      fetch('/playback/load', { method: 'POST', body: text })
         .then(resp => {
            if (resp.ok) {
               return resp.json().then(data => {
                  recordingLoaded = true;
                  recordingLineCount = data.lines;
                  updatePlaybackUI();
                  document.getElementById('footerInfo').textContent =
                     `Recording loaded: ${data.lines} messages from ${file.name}`;
               });
            } else {
               resp.text().then(t => {
                  document.getElementById('footerInfo').textContent =
                     `Load error: ${t}`;
               });
            }
         })
         .catch(ex => {
            document.getElementById('footerInfo').textContent =
               `Load error: ${ex.message}`;
         });
   };
   reader.readAsText(file);
   event.target.value = '';
}

function togglePlayback() {
   if (!playing) {
      send({ type: 'playback_start' });
   } else {
      send({ type: 'playback_stop' });
   }
}

function updatePlaybackUI() {
   const btn = document.getElementById('btnPlayback');
   btn.disabled = !recordingLoaded;
   if (playing) {
      btn.textContent = 'Stop';
      btn.classList.add('playing');
   } else {
      btn.textContent = 'Playback';
      btn.classList.remove('playing');
   }
}

function updateProgress(current, total) {
   const bar = document.getElementById('progressBar');
   const fill = document.getElementById('progressFill');
   bar.classList.add('active');
   const pct = (current / total * 100).toFixed(1);
   fill.style.width = pct + '%';
   document.getElementById('footerInfo').textContent =
      `Playback: ${current} / ${total} (${pct}%)`;
}

function resetProgress() {
   const bar = document.getElementById('progressBar');
   const fill = document.getElementById('progressFill');
   bar.classList.remove('active');
   fill.style.width = '0%';
}

function esc(s) {
   const d = document.createElement('div');
   d.textContent = s;
   return d.innerHTML;
}

// Start
connect();
</script>
</body>
</html>
